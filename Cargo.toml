[workspace]
members = ["crates/oxy-protocol", "crates/oxy-compositor-core", "crates/oxy-ipc", "crates/oxy-client", "crates/oxy-client-ffi", "crates/oxy-gpu", "crates/oxy-kms", "crates/oxy-input", "crates/oxy-vt", "tools/oxy-platform-probe", "tools/oxy-kms-probe", "tools/oxy-kms-show", "tools/oxy-offscreen"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
