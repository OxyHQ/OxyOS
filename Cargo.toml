[workspace]
members = ["crates/oxyos-protocol", "crates/oxyos-compositor-core", "crates/oxyos-ipc", "crates/oxyos-client", "crates/oxyos-client-ffi", "crates/oxyos-gpu", "crates/oxyos-dmabuf", "crates/oxyos-paint", "crates/oxyos-gpu-device", "crates/oxyos-kms", "crates/oxyos-input", "crates/oxyos-vt", "crates/oxyos-seat", "crates/oxyos-compositor", "crates/oxyos-net", "tools/oxyos-platform-probe", "tools/oxyos-kms-probe", "tools/oxyos-kms-show", "tools/oxyos-offscreen", "tools/oxyos-session", "crates/oxyos-image", "crates/oxyos-vector", "crates/oxyos-gestures", "crates/oxyos-intl", "crates/oxyos-auth", "crates/oxyos-solar", "crates/oxyos-apps", "crates/oxyos-app-storage", "crates/oxyos-speech", "crates/oxyos-sound", "crates/oxyos-audio", "tools/oxyos-reader", "crates/oxyos-preferences", "crates/oxyos-wallpaper", "tools/oxyos-boot-logo", "crates/oxyos-account", "crates/oxyos-keychain", "crates/oxyos-controls", "crates/oxyos-input-methods", "crates/oxyos-networks", "crates/oxyos-power", "crates/oxyos-activity", "crates/oxyos-bluetooth", "crates/oxyos-files", "crates/oxyos-search", "tools/oxyos-accountd", "tools/oxyos-login", "crates/oxyos-package", "crates/oxyos-install", "tools/oxyos-installd", "tools/oxyos-pack", "tools/oxyos-gpu-client", "crates/oxyos-recovery", "tools/oxyos-recovery"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Argon2id at the keychain's cost (64 MiB, three passes) takes seconds unoptimized; tests derive
# keybag keys at that cost, so its crates are optimized in debug builds too.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
