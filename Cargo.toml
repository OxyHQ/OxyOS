[workspace]
members = ["crates/oxyos-protocol", "crates/oxyos-compositor-core", "crates/oxyos-ipc", "crates/oxyos-client", "crates/oxyos-client-ffi", "crates/oxyos-gpu", "crates/oxyos-kms", "crates/oxyos-input", "crates/oxyos-vt", "crates/oxyos-seat", "crates/oxyos-compositor", "crates/oxyos-net", "tools/oxyos-platform-probe", "tools/oxyos-kms-probe", "tools/oxyos-kms-show", "tools/oxyos-offscreen", "tools/oxyos-session", "crates/oxyos-image"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
