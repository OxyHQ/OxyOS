[package]
name = "oxyos-keychain"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The vault's cryptography (Oxy ADR 0063 D8), from RustCrypto and dalek alone; nothing by hand.
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std", "zeroize", "fast"] }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
hkdf = "0.12.4"
hmac = "0.12.1"
sha1.workspace = true
sha2.workspace = true
# The keybag's key from the account's password (OxyOS ADR 0050 decision 2).
argon2.workspace = true
# The system's CSPRNG (getrandom), and uniform draws from it.
rand_core.workspace = true
rand = { version = "0.8.5", default-features = false, features = ["std", "getrandom"] }
# Secrets overwritten when dropped.
zeroize = { workspace = true, features = ["derive"] }
# The wire's JSON, its RFC 8785 canonical form, base64url and Crockford base32.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_json_canonicalizer = "0.4.1"
base64.workspace = true
data-encoding.workspace = true
# The otpauth:// URI of a verification code, decoded into buffers that are overwritten.
percent-encoding = "2"
# Comparing a typed-back recovery key and a commitment in constant time.
subtle.workspace = true
# A weak password is one zxcvbn estimates under 10⁸ guesses (ADR 0050 decision 8), as Dropbox's.
zxcvbn = { version = "3", default-features = false }
# The store's checks: the effective user, opening without following a link; locking keys in
# memory (mlock) and the page size.
rustix = { workspace = true, features = ["std", "process", "fs", "mm", "param"] }
# Passkeys (OxyOS ADR 0050 decision 7): ES256 keys and signatures from RustCrypto's P-256, kept as
# PKCS #8; WebAuthn's CBOR (the COSE key, the attestation object) from ciborium.
p256 = { version = "0.13.2", default-features = false, features = ["std", "ecdsa", "pkcs8", "arithmetic"] }
ciborium.workspace = true

[dev-dependencies]
hex = "0.4"
# An independent verifier of the passkeys' signatures: ring's ECDSA, not RustCrypto's.
ring.workspace = true

[lints]
workspace = true
