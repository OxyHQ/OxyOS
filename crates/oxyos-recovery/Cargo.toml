[package]
name = "oxyos-recovery"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The erase request on the EFI system partition and lsblk's and systemd-repart's answers are JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Passwords, recovery keys and the install key overwritten in memory once used.
zeroize = "1"

[lints]
workspace = true
