[package]
name = "oxyos-bluetooth"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# BlueZ over the system bus, in safe Rust (docs/adr/0050-bluetooth.mdx): its objects followed, its
# calls made and the session's pairing agent served, on one connection the caller's thread runs.
zbus = "5"
async-io = "2"
futures-lite = "2"
# The caller's commands and the agent's answers, awaited with the bus on that one thread.
async-channel = "2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
