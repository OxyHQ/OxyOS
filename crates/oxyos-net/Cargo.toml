[package]
name = "oxyos-net"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# HTTP with TLS in Rust (rustls, verified against the system's certificates).
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip", "brotli"] }
# The process's cookie jar; redirects are followed here so each hop's cookies are kept and sent.
cookie_store = { version = "0.22", default-features = false }
url = "2"
# rtnetlink, told of every link, address and route change (connectivity.rs).
rustix = { version = "1.1.6", default-features = false, features = ["std", "net"] }

# The HTTP cache (cache.rs): its entries' file names (SHA-256 of their URL) and HTTP's dates.
sha2 = "0.10"
jiff = { version = "0.2", default-features = false, features = ["std"] }

[lints]
workspace = true
