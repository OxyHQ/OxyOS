[package]
name = "oxyos-wallpaper"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The person's choice and its grammar (docs/adr/0048-wallpapers.mdx).
oxyos-preferences.workspace = true
# Where the sun is: a dynamic wallpaper's variant (docs/adr/0012-solar-wallpaper.mdx).
oxyos-solar.workspace = true
# A photo's thumbnail decoded at its size, as the hosts decode images, and kept as a PNG.
oxyos-image.workspace = true
png.workspace = true
# The catalog's JSON, read strictly.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
# The Solar Gradients wallpaper's renderer (examples/make-solar-gradients.rs) writes its variants as
# JPEG, in Rust, as the platform's own images are read.
jpeg-encoder = "0.7"

[lints]
workspace = true
