[package]
name = "oxyos-apps"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Asking an application's process to stop (SIGTERM).
rustix = { workspace = true, features = ["std", "process", "fs"] }
# The image's policy of system applications (docs/adr/0030-installing-applications.mdx), JSON.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# A package's manifest names its source bundle, which its assets are beside (ADR 0030).
oxyos-package.workspace = true

[dev-dependencies]
# The install service's layout, which the registry's second source must be (tests only).
oxyos-install.workspace = true

[lints]
workspace = true
