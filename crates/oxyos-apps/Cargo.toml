[package]
name = "oxyos-apps"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The application id's rule, the package format's (docs/adr/0030-installing-applications.mdx), and
# the session's POSIX locale, read and split as every other crate reads it.
oxyos-names = { path = "../oxyos-names" }
# Asking an application's process to stop (SIGTERM).
rustix = { version = "1.1.6", default-features = false, features = ["std", "process", "fs"] }
# The image's policy of system applications (docs/adr/0030-installing-applications.mdx), JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A package's manifest names its source bundle, which its assets are beside (ADR 0030).
oxyos-package = { path = "../oxyos-package" }

[dev-dependencies]
# The install service's layout, which the registry's second source must be (tests only).
oxyos-install = { path = "../oxyos-install" }

[lints]
workspace = true
