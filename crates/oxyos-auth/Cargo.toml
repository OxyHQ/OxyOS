[package]
name = "oxyos-auth"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The C types PAM's interface uses, and malloc for the answers PAM frees.
libc = "0.2"
# Overwrites a password in memory once PAM has it.
zeroize = "1"
rustix = { version = "1.1.6", default-features = false, features = ["std", "process", "pipe"] }

[dev-dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "event"] }

# The workspace forbids `unsafe`. Calling PAM, a C library, needs it, so this crate denies it
# instead and allows it item by item; every unsafe block states why it is sound.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
