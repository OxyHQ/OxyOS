[package]
name = "oxyos-auth"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The C types PAM's interface uses, and malloc for the answers PAM frees.
libc.workspace = true
# Overwrites a password in memory once PAM has it.
zeroize.workspace = true
# One message a packet on the greeter's socket, its last never lost to its end.
oxyos-seqpacket.workspace = true
rustix = { workspace = true, features = ["std", "process", "pipe", "net", "fs"] }

[dev-dependencies]
rustix = { workspace = true, features = ["std", "event"] }

[lints]
workspace = true
