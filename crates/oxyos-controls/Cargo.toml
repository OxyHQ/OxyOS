[package]
name = "oxyos-controls"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
oxyos-protocol = { path = "../oxyos-protocol" }
# logind's SetBrightness on the session.
oxyos-seat = { path = "../oxyos-seat" }
# UPower, NetworkManager and BlueZ over the system bus, in safe Rust.
zbus = "5"
# Following the bus's signals and the order to stop at once, on zbus's own executor (follow.rs).
async-io = "2"
futures-lite = "2"
# Waiting on sysfs attributes' notifications and the order to stop (follow.rs).
rustix = { version = "1.1.6", default-features = false, features = ["std", "event"] }
# The volumes of PipeWire's chosen output and input, through the session's own client
# (docs/adr/0051-sound-devices.mdx).
oxyos-audio = { path = "../oxyos-audio" }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
