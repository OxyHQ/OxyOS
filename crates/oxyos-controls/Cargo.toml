[package]
name = "oxyos-controls"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
oxyos-protocol.workspace = true
# logind's SetBrightness on the session.
oxyos-seat.workspace = true
# UPower, NetworkManager and BlueZ over the system bus, in safe Rust.
zbus.workspace = true
# Following the bus's signals and the order to stop at once, on zbus's own executor (follow.rs).
async-io.workspace = true
futures-lite.workspace = true
# Waiting on sysfs attributes' notifications and the order to stop (follow.rs).
rustix = { workspace = true, features = ["std", "event"] }
# The volumes of PipeWire's chosen output and input, through the session's own client
# (docs/adr/0056-sound-devices.mdx).
oxyos-audio.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
