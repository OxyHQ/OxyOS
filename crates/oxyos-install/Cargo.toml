[package]
name = "oxyos-install"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The package's manifest, signatures and tree checks, and its strict JSON reader, which the
# store's TUF metadata is read with too.
oxyos-package.workspace = true
oxyos-seqpacket.workspace = true
# Ed25519 for the TUF metadata's signatures and SHA-256 for its hashes: the crate rustls already
# brings, as oxyos-package uses it.
ring.workspace = true
# The sockets (SOCK_SEQPACKET, peer credentials, descriptors passed with SCM_RIGHTS), files by
# descriptor (openat, linkat, renameat, fsync, fchown, memfd) and the effective user id.
rustix = { workspace = true, features = ["std", "fs", "net", "process"] }
# The service's socket and its records speak JSON, as oxyos-accountd's do.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[lints]
workspace = true
