[package]
name = "oxyos-networks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# NetworkManager over the system bus, in safe Rust (docs/adr/0038-networks.mdx).
zbus.workspace = true
# Waiting for an activation's outcome with a deadline, on zbus's own executor.
async-io.workspace = true
futures-lite.workspace = true
serde = { workspace = true, features = ["derive"] }
# Wi-Fi Diagnostics' echo requests to the router: an unprivileged ICMP datagram socket, polled.
rustix = { workspace = true, features = ["std", "net", "event"] }
serde_json.workspace = true

[lints]
workspace = true
