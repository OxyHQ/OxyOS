[package]
name = "oxyos-client-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
oxyos-client.workspace = true
oxyos-net.workspace = true
oxyos-image.workspace = true
oxyos-gestures.workspace = true
oxyos-intl.workspace = true
oxyos-solar.workspace = true
# The person's wallpapers: what a display shows, the catalog, thumbnails (docs/adr/0048-wallpapers.mdx).
oxyos-preferences.workspace = true
oxyos-wallpaper.workspace = true
oxyos-apps.workspace = true
oxyos-files = { workspace = true, default-features = true }
oxyos-app-storage.workspace = true
# The accounts' service's sockets and their types, without its HTTP client.
oxyos-account.workspace = true
# The migration service's socket (docs/adr/0059-backups.mdx, migration.rs): SOCK_SEQPACKET messages
# of up to 64 KiB, a computer's list of backups among them.
oxyos-install.workspace = true
oxyos-protocol.workspace = true
oxyos-paint.workspace = true
oxyos-gpu-device.workspace = true
rustix = { workspace = true, features = ["std", "rand", "event"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Secrets (a password, a device secret, a token) in buffers overwritten when dropped (account_session.rs).
zeroize.workspace = true
# expo-crypto's digests (the ring rustls already builds).
ring.workspace = true
# A passkey's client data and its answers, base64url as WebAuthn's JSON carries them.
base64.workspace = true

[dev-dependencies]
# A WebSocket server for the C ABI's test.
tungstenite.workspace = true
png.workspace = true
oxyos-ipc.workspace = true
oxyos-dmabuf.workspace = true
# A backup service played on a socket for the files' test (its SOCK_SEQPACKET and SCM_RIGHTS).
oxyos-install.workspace = true

[lints]
workspace = true
