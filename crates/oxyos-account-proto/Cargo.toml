[package]
name = "oxyos-account-proto"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Passwords, device secrets and tokens in the messages: overwritten when dropped, never printed.
oxyos-secret = { path = "../oxyos-secret", features = ["serde"] }
oxyos-service-socket = { path = "../oxyos-service-socket" }
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
