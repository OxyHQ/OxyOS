[package]
name = "oxyos-seat"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# systemd-logind over the system bus, in safe Rust.
zbus = "5"
# Waiting on the bus with its own block_on, never async-io's (`system_bus`).
futures-lite = "2"
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "process"] }

[lints]
workspace = true
