[package]
name = "oxyos-files"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The file system's own calls: renaming without replacing (renameat2), inotify, poll and the
# user's id.
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "event", "process"] }
# Requests and answers between the Bloom host and the service, as JSON.
serde_json = "1"
# The Trash's deletion dates, in local time as the freedesktop.org Trash specification writes them.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }

# expo-file-system's base64 content.
base64 = "0.23"
# File digests (`File.digest`, `md5`): RustCrypto's MD5, SHA-1 and SHA-2.
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
# Downloads and uploads of files (the `service` feature).
oxyos-net = { path = "../oxyos-net", optional = true }
# An application's id, by the registry's own rule.
oxyos-apps = { path = "../oxyos-apps" }
# Where the user's folders are (xdg-user-dirs' `user-dirs.dirs`).
oxyos-preferences = { path = "../oxyos-preferences" }

[features]
# The service an application's host runs (`Service`, transfers through `oxyos-net`). Without it,
# what a path may name and the operations on files alone: what the session checks a file
# chooser's answer by (docs/adr/0029-chromium-on-oxyos.mdx, decision 8), with no network stack.
default = ["service"]
service = ["dep:oxyos-net"]

[lints]
workspace = true
