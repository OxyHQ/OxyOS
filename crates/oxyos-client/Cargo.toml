[package]
name = "oxyos-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
oxyos-protocol = { path = "../oxyos-protocol" }
oxyos-ipc = { path = "../oxyos-ipc" }
oxyos-dmabuf = { path = "../oxyos-dmabuf" }
rustix = { version = "1.1.6", default-features = false, features = ["std", "pipe"] }
# A fill's credential overwritten when it goes (docs/adr/0050-keychain-autofill-and-passkeys.mdx).
zeroize = "1"

[lints]
workspace = true

[dev-dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["fs"] }
