[package]
name = "oxyos-input"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# libinput (devices, pointer acceleration, touchpads) through udev; xkbcommon for the keymap:
# the compositor turns keys into text (docs/adr/0004-gpu-composition.mdx, #32).
input = "0.10"
xkbcommon = { version = "0.9", default-features = false }
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
# A mouse plugged in, made in the kernel (uinput), for the seat's root-only test.
evdev = "0.13"

[lints]
workspace = true
