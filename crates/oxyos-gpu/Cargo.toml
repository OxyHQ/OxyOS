[package]
name = "oxyos-gpu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Vulkan, loaded at run time: no link-time dependency on a driver (docs/adr/0004).
ash.workspace = true
# Only the displays' GPU's drivers loaded, its device chosen by its DRM node.
oxyos-gpu-device.workspace = true

[dev-dependencies]
# Polls a frame's completion as a sync file in the tests.
rustix = { workspace = true, features = ["std", "event"] }
# DMA-BUFs of shared memory for the import tests (docs/adr/0031).
oxyos-dmabuf.workspace = true

[build-dependencies]
# Compiles the WGSL compute shader to SPIR-V at build time.
naga = { version = "26", default-features = false, features = ["wgsl-in", "spv-out"] }

[lints]
workspace = true
