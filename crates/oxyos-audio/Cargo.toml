[package]
name = "oxyos-audio"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# PipeWire's own Rust bindings (the PipeWire project's): the session's one audio stack, its
# outputs and inputs, their volumes and the default chosen through WirePlumber's metadata
# (docs/adr/0056-sound-devices.mdx).
pipewire.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[lints]
workspace = true
[dev-dependencies]
# Waiting on the client's waker in its tests.
rustix = { workspace = true, features = ["std", "event"] }
