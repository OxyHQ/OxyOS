[package]
name = "oxyos-account"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# HTTP to Oxy's API with TLS in Rust (rustls, verified against the system's certificates), as
# `oxyos-net` uses it; no cookies, no redirects.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
url = "2"
# Oxy's API speaks JSON, and so do the service's socket and its state files.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Passwords, device secrets and tokens overwritten in memory once used.
zeroize = "1"
# The socket (SOCK_SEQPACKET, the peer's credentials from the kernel) and the effective user id.
rustix = { version = "1.1.6", default-features = false, features = ["std", "net", "process"] }

[lints]
workspace = true
