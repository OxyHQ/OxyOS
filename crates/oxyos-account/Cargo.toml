[package]
name = "oxyos-account"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The service's HTTP client to Oxy's API (`api::HttpApi`). The session program and the client
# library speak only the service's sockets, and leave it out.
default = ["http", "keychain", "local"]
http = ["dep:ureq", "dep:url"]
# The accounts' keychains (ADR 0050): the service's alone. The session program, the login program
# and the client library speak the sockets' messages, which need none of it, and leave it out.
keychain = ["http", "dep:oxyos-keychain", "dep:subtle", "dep:psl"]
# The accounts' PINs (ADR 0020 decision 2): their verifiers, made and checked by the service alone.
# The other programs speak the messages, which need none of it, and leave it out.
local = ["dep:argon2", "dep:rand_core"]

[dependencies]
# A PIN's verifier: Argon2id in the PHC string format, as the keybag's key is derived (ADR 0050),
# its salt from the system's CSPRNG.
argon2 = { workspace = true, features = ["password-hash", "rand"], optional = true }
rand_core = { workspace = true, optional = true }
oxyos-keychain = { workspace = true, optional = true }
oxyos-seqpacket.workspace = true
# Comparing the password the machine learned with the one Settings gives, in constant time.
subtle = { workspace = true, optional = true }
# Whether a relying party id is a registrable domain suffix of an application's web origin
# (WebAuthn's rule), by the Public Suffix List.
psl = { version = "2", optional = true }
# HTTP to Oxy's API with TLS in Rust (rustls, verified against the system's certificates), as
# `oxyos-net` uses it; no cookies, no redirects.
ureq = { workspace = true, optional = true }
url = { workspace = true, optional = true }
# Oxy's API speaks JSON, and so do the service's sockets and its state files.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Passwords, device secrets and tokens overwritten in memory once used.
zeroize.workspace = true
# The sockets (SOCK_SEQPACKET, the peer's credentials from the kernel, a process handed over as a
# pidfd), the effective user id, the subscribers' wakeups (eventfd), a new home's seeded file
# written without following links, and a redemption's key from the kernel's random numbers.
rustix = { workspace = true, features = ["std", "net", "process", "event", "fs", "rand", "time"] }
# The preferences a new account's home is seeded with (its appearance, chosen at setup), in the
# session's own format.
oxyos-preferences.workspace = true
# A token's expiry, an RFC 3339 time (`expiresAt`).
jiff.workspace = true
# The peer's pidfd (`SO_PEERPIDFD`), which rustix does not wrap: one getsockopt.
libc.workspace = true

[dev-dependencies]
# The passkeys' registrations and assertions read and verified as a relying party would, by
# implementations independent of the service's (ring's ECDSA, ciborium's CBOR reading).
ring.workspace = true
ciborium.workspace = true
sha2.workspace = true
# The session's launcher, launching under a live registrar across the service's restarts and an
# upgrade of the image's policy and entries (`tests/restart.rs`).
oxyos-apps.workspace = true

[lints]
workspace = true
