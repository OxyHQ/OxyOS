[package]
name = "oxyos-dmabuf"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# DRM syncobj timelines on a render node (docs/adr/0031-gpu-buffers.mdx, decision 6).
drm.workspace = true
rustix = { workspace = true, features = ["std", "fs", "mm", "event"] }
# The one GPU whose node may be opened: the compositor's, or the displays' (ADR 0031, decision 14).
oxyos-gpu-device.workspace = true

[dev-dependencies]
rustix = { workspace = true, features = ["pipe"] }

[lints]
workspace = true
