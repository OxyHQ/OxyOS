[package]
name = "oxyos-secret"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# A secret written into and read from the services' JSON (the accounts' service, the keychain).
serde = ["dep:serde"]

[dependencies]
# The secret's buffer overwritten when it goes.
zeroize = "1"
serde = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
