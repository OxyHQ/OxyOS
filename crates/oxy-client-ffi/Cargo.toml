[package]
name = "oxy-client-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
oxy-client = { path = "../oxy-client" }
oxy-net = { path = "../oxy-net" }
oxy-protocol = { path = "../oxy-protocol" }
rustix = { version = "1.1.6", default-features = false, features = ["std"] }

[dev-dependencies]
oxy-ipc = { path = "../oxy-ipc" }

# The workspace forbids `unsafe`. A C ABI needs it, so this crate denies it instead and allows it
# item by item; every unsafe block states why it is sound.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
