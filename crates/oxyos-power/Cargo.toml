[package]
name = "oxyos-power"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The system bus's connections as the session keeps them (a thread waiting long wakes for nothing).
oxyos-seat = { path = "../oxyos-seat" }
# UPower, power-profiles-daemon and logind over the system bus, in safe Rust; the played ones of
# the tests and the development compositor serve the same interfaces on a bus of their own.
zbus = "5"
# Following power-profiles-daemon's signals and the order to stop at once (follow.rs).
async-io = "2"
futures-lite = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The clock's ticks a process's CPU time is counted in (energy.rs).
rustix = { version = "1.1.6", default-features = false, features = ["std", "param", "event"] }

[lints]
workspace = true
