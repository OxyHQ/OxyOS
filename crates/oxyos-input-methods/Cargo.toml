[package]
name = "oxyos-input-methods"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# fcitx5's D-Bus frontend, on the session's private bus, in safe Rust.
zbus = "5"
# The bodies of its calls.
serde = "1"
# Waiting on the bus with its own block_on, never async-io's (`engine_bus`).
futures-lite = "2"

[lints]
workspace = true

[dev-dependencies]
# zbus's reactor started before a test counts descriptors.
async-io = "2"
