[package]
name = "oxyos-paint"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Vulkan, loaded at run time, as oxyos-gpu does (docs/adr/0031-gpu-buffers.mdx, decision 12).
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
oxyos-client = { path = "../oxyos-client" }
# Only the compositor's GPU's drivers loaded, its device chosen by its DRM node.
oxyos-gpu-device = { path = "../oxyos-gpu-device" }
oxyos-protocol = { path = "../oxyos-protocol" }
rustix = { version = "1.1.6", default-features = false, features = ["std", "event", "fs"] }

[dev-dependencies]
# The present test plays the compositor: the connection, the DMA-BUF read and the timeline.
oxyos-ipc = { path = "../oxyos-ipc" }
oxyos-dmabuf = { path = "../oxyos-dmabuf" }
# The compositors-gpu example opens the compositor's device as the session does.
oxyos-gpu = { path = "../oxyos-gpu" }

# The workspace forbids `unsafe`. Vulkan needs it, so this crate denies it instead and allows it
# where Vulkan is called; every unsafe block states why it is sound.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
