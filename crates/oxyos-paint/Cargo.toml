[package]
name = "oxyos-paint"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Vulkan, loaded at run time, as oxyos-gpu does (docs/adr/0031-gpu-buffers.mdx, decision 12).
ash.workspace = true
oxyos-client.workspace = true
# Only the compositor's GPU's drivers loaded, its device chosen by its DRM node.
oxyos-gpu-device.workspace = true
oxyos-protocol.workspace = true
rustix = { workspace = true, features = ["std", "event", "fs"] }

[dev-dependencies]
# The present test plays the compositor: the connection, the DMA-BUF read and the timeline.
oxyos-ipc.workspace = true
oxyos-dmabuf.workspace = true
# The compositors-gpu example opens the compositor's device as the session does.
oxyos-gpu.workspace = true

[lints]
workspace = true
