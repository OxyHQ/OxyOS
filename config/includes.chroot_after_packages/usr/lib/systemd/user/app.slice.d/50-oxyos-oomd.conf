# systemd-oomd acts on the applications alone (docs/adr/0066-quality-of-service.mdx, decision 7):
# when their memory pressure stays above oomd.conf's limit (60 % for 30 s), or swap is nearly full,
# it ends the application (its scope, app-oxyos-<id>-<pid>.scope) whose pressure or swap is the
# highest, before the kernel's OOM killer would pick any process, the compositor's among them.
# Never on user.slice or the session: there oomd's candidates would be every leaf of the users'
# slices (PipeWire's, the user manager's own), whose preferences it ignores for a root-owned slice.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMSwap=kill
