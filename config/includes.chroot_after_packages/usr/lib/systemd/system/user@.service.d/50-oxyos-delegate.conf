# OxyOS: each user's manager is given the processor sets and the disk's controller too, beside
# systemd's own (pids, memory, cpu), so its background.slice can be held to the efficiency cores
# (AllowedCPUs, the generator oxyos-efficiency-cores) and its applications' scopes given disk
# weights (docs/adr/0066-quality-of-service.mdx, decisions 5 and 6). A list given again adds to it.
# A manager running when this changes takes it at its next start (the person's next login).
[Service]
Delegate=cpuset io
