# The users' memory protected as their sessions' is (docs/adr/0066-quality-of-service.mdx, decision 7):
# a protection is only as large as each of its ancestors', so the users' slice holds enough for the
# person at the seat's session and its user manager's, and another user's beside them.
[Slice]
MemoryMin=1G
MemoryLow=256M
