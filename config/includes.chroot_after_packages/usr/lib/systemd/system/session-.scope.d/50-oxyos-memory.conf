# The session's own memory protected (docs/adr/0066-quality-of-service.mdx, decision 7): the
# compositor, the shell and the session's services, in logind's scope for the session, are never
# reclaimed below this however short of memory the machine is, so the screen keeps answering. Only
# what the session uses is protected; an application's memory is its own scope's in the user
# manager's app.slice, never this.
[Scope]
MemoryMin=512M
