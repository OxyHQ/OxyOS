# Memory compressed before it is swapped, and the working set kept (docs/adr/0066-quality-of-service.mdx,
# decision 7), set as the system starts, never on the kernel's command line.
#
# zswap: pages on their way to the swap the installer makes are compressed into a pool in memory
# first (lz4, cheap enough to run on every page; zsmalloc, the densest pool), at most a fifth of
# memory, its coldest pages written out to the disk swap as the pool fills and as memory comes short
# (the shrinker). The compressor is set before zswap is turned on (paths in order); lz4 is a module
# the system loads first (modules-load.d/oxyos-zswap.conf).
w- /sys/module/zswap/parameters/compressor       - - - - lz4
w- /sys/module/zswap/parameters/enabled          - - - - Y
w- /sys/module/zswap/parameters/max_pool_percent - - - - 20
w- /sys/module/zswap/parameters/shrinker_enabled - - - - Y
w- /sys/module/zswap/parameters/zpool            - - - - zsmalloc
# MGLRU's thrashing protection: the pages used in the last second are never evicted to make room;
# the kernel ends a process (as the OOM killer would) rather than thrash the working set out.
w- /sys/kernel/mm/lru_gen/min_ttl_ms             - - - - 1000
