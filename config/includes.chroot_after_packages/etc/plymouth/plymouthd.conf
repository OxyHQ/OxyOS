# OxyOS's boot logo (docs/adr/0017-boot-logo.mdx). Administrator customizations go here too.
[Daemon]
# The Oxy mark on black, the session's splash.
Theme=oxyos
# Shown from Plymouth's first frame, not after a delay.
ShowDelay=0
# One theme pixel for each of the display's: the theme draws the session's pixels, at the
# display's own size, and must not be doubled on a dense panel.
DeviceScale=1
