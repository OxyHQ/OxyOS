# A native crash's evidence (docs/adr/0068-crash-evidence-and-kernel-panics.mdx), as a Mac's
# ReportCrash keeps it: the crash's backtrace, logged with its signal, its program and its unit for
# every process whose core limit allows it (the person's session and what it starts; installd), and
# never its memory. A core holds everything the process held (a password being typed, a keychain's
# keys), so none is kept on the disk: systemd-coredump reads it, writes the backtrace to the journal
# and lets it go. A process too large to read whole (past 2 GB) is logged without its backtrace.
[Coredump]
Storage=none
ProcessSizeMax=2G
