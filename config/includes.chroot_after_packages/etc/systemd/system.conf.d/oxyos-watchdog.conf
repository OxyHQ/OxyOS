# The hardware watchdog (docs/adr/0068-crash-evidence-and-kernel-panics.mdx): systemd, the system's
# first process, tells the machine's watchdog it is alive every half of RuntimeWatchdogSec=; a
# machine that stopped altogether (a hard lockup no panic reports, the freeze of 1 November 2026)
# is restarted by the watchdog's own hardware 30 seconds later, as a Mac's watchdog restarts one
# whose window server stopped checking in. A restart that hangs is forced after ten minutes. A
# machine without a watchdog device is unaffected.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=10min
