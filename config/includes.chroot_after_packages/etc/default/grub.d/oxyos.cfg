# OxyOS boot chime. A drop-in, so Debian's /etc/default/grub stays intact.
GRUB_INIT_TUNE="600 988 1 1319 8"

# The boot logo's command line (docs/adr/0017-boot-logo.mdx): Plymouth's splash, only errors on
# the console, no console cursor until the login prompt shows it again (/etc/issue), and the
# splash on the screen even where the firmware names a serial console (config/binary).
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 vt.global_cursor_default=0 plymouth.ignore-serial-consoles"
