# A process may trace only its own descendants (Yama's scope 1, as Ubuntu, Fedora and ChromeOS set
# it): an application a session launched cannot attach to the session program or to another
# application of the same user and take what they hold, such as an application's Oxy token
# (docs/adr/0020-oxy-account-login.mdx, step 5; Oxy ADR 0058, decision 3). Debian's kernel leaves
# it at 0. Until applications are sandboxed it is the whole of the isolation between them.
kernel.yama.ptrace_scope = 1
