# The kernel restarts by itself and says why (docs/adr/0068-crash-evidence-and-kernel-panics.mdx),
# as a Mac restarts after a kernel panic: a panic restarts the machine after 10 seconds instead of
# leaving it frozen for ever (Debian's kernel waits for ever: 0), and an oops, the kernel finding
# itself broken, is a panic, since what it broke is unknown and the panic's text survives the
# restart (efi-pstore, systemd-pstore) for the next login to tell the person. Soft lockups and
# hung tasks are not panics: a laptop's slow disk or a GPU's long reset would restart the machine
# under the person's hands, worse than the stall; the hardware watchdog (system.conf.d) catches
# a machine that stopped altogether.
kernel.panic = 10
kernel.panic_on_oops = 1
