[package]
name = "oxyos-recovery-tool"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "oxyos-recovery"
path = "src/main.rs"

[dependencies]
oxyos-recovery = { path = "../../crates/oxyos-recovery" }
zeroize = "1"
# Restore from Backup (docs/adr/0059-backups.mdx, decision 7): the backups' library, the source a
# request names as it wrote it, and a backup's date as the person reads it.
oxyos-backup = { path = "../../crates/oxyos-backup" }
serde_json = "1"
jiff = { version = "0.2", default-features = false, features = ["std"] }
# The console's echo turned off while a password is typed.
rustix = { version = "1.1.6", default-features = false, features = ["std", "termios"] }

[lints]
workspace = true
