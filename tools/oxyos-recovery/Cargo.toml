[package]
name = "oxyos-recovery-tool"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "oxyos-recovery"
path = "src/main.rs"

[dependencies]
oxyos-recovery.workspace = true
zeroize.workspace = true
# Restore from Backup (docs/adr/0059-backups.mdx, decision 7): the backups' library, the source a
# request names as it wrote it, and a backup's date as the person reads it.
oxyos-backup.workspace = true
serde_json.workspace = true
jiff.workspace = true
# The console's echo turned off while a password is typed.
rustix = { workspace = true, features = ["std", "termios"] }

[lints]
workspace = true
