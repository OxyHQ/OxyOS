# A Mac's start on a machine that boots with GRUB (docs/adr/0054-recovery-and-erasing.mdx,
# "Machines that boot with GRUB"; docs/adr/0017-boot-logo.mdx): no menu, straight to the boot logo.
# Installed as /etc/default/grub.d/oxyos-boot.cfg, read by update-grub after /etc/default/grub.
#
# The menu is hidden, and GRUB waits one second (it counts whole seconds) for a key held as the
# machine starts:
#   R      starts OxyOS Recovery (its entry's hotkey, /etc/grub.d/42_oxyos_recovery), as ⌘R does;
#   Esc    (or Shift) shows the menu, every kernel and the recovery, as Option does.
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=1
# Debian's GRUB keeps no record of failed starts (its recordfail is built out); were it there, it
# would not show the menu either: OxyOS's boot counting (/etc/grub.d/01_oxyos_boot_tries) is what
# answers starts that never complete, with the recovery.
GRUB_RECORDFAIL_TIMEOUT=0
