# Once systemd-bless-boot has marked a boot good, the entry that booted gets its tries back
# (oxyos-boot-tries.service, docs/adr/0054-recovery-and-erasing.mdx, decision 2). Pulled in from
# here, not from multi-user.target: a target is ordered after what it wants, and boot-complete.target
# is ordered after multi-user.target, which would make a cycle.
[Unit]
Wants=oxyos-boot-tries.service
