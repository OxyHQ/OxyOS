[package]
name = "oxy-offscreen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
oxy-protocol = { path = "../../crates/oxy-protocol" }
oxy-compositor-core = { path = "../../crates/oxy-compositor-core" }
oxy-ipc = { path = "../../crates/oxy-ipc" }
oxy-client = { path = "../../crates/oxy-client" }
oxy-gpu = { path = "../../crates/oxy-gpu" }
oxy-kms = { path = "../../crates/oxy-kms" }
oxy-input = { path = "../../crates/oxy-input" }
oxy-vt = { path = "../../crates/oxy-vt" }
# Virtual devices for `--launch --uinput`: the director types and points through the kernel.
evdev = "0.13"
rustix = { version = "1.1.6", default-features = false, features = ["std", "event", "time"] }

