[package]
name = "oxyos-session"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
oxyos-protocol.workspace = true
oxyos-compositor-core.workspace = true
oxyos-ipc.workspace = true
oxyos-gpu.workspace = true
oxyos-gpu-device.workspace = true
oxyos-kms.workspace = true
oxyos-input.workspace = true
oxyos-seat.workspace = true
oxyos-compositor.workspace = true
# The search service, which this program runs as its child (docs/adr/0051-search.mdx).
oxyos-search.workspace = true
# The system's sounds through PipeWire (docs/adr/0044-system-sounds.mdx).
oxyos-sound.workspace = true
# The account's files, which a file chooser's answer is checked against (ADR 0029, decision 8).
oxyos-files.workspace = true
oxyos-controls.workspace = true
# Battery and energy (docs/adr/0057-battery-and-energy.mdx).
oxyos-power.workspace = true
# The backup service's socket (docs/adr/0059-backups.mdx).
oxyos-backup.workspace = true
oxyos-auth.workspace = true
# The accounts' service's session socket: what it launches registered, the lock's online check
# (docs/adr/0020-oxy-account-login.mdx). Its sockets only, not its HTTP client.
oxyos-account.workspace = true
oxyos-apps.workspace = true
# Where the user's Desktop and Documents are, for screenshots (xdg-user-dirs).
oxyos-preferences.workspace = true
# Holding, and noting, the installed versions it runs (docs/adr/0030-installing-applications.mdx).
oxyos-install.workspace = true
serde_json.workspace = true
rustix = { workspace = true, features = ["std", "process"] }
signal-hook.workspace = true

[dev-dependencies]
# AutoFill's tests wait on the provider's descriptor and speak to a played accounts' service.
rustix = { workspace = true, features = ["std", "event", "net", "time"] }

[lints]
workspace = true
