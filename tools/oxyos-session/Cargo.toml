[package]
name = "oxyos-session"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
oxyos-protocol = { path = "../../crates/oxyos-protocol" }
oxyos-compositor-core = { path = "../../crates/oxyos-compositor-core" }
oxyos-ipc = { path = "../../crates/oxyos-ipc" }
oxyos-gpu = { path = "../../crates/oxyos-gpu" }
oxyos-gpu-device = { path = "../../crates/oxyos-gpu-device" }
oxyos-kms = { path = "../../crates/oxyos-kms" }
oxyos-input = { path = "../../crates/oxyos-input" }
oxyos-seat = { path = "../../crates/oxyos-seat" }
oxyos-compositor = { path = "../../crates/oxyos-compositor" }
# The account's files, which a file chooser's answer is checked against (ADR 0029, decision 8).
oxyos-files = { path = "../../crates/oxyos-files", default-features = false }
oxyos-controls = { path = "../../crates/oxyos-controls" }
oxyos-auth = { path = "../../crates/oxyos-auth" }
oxyos-apps = { path = "../../crates/oxyos-apps" }
# Where the user's Desktop and Documents are, for screenshots (xdg-user-dirs).
oxyos-preferences = { path = "../../crates/oxyos-preferences" }
# Holding, and noting, the installed versions it runs (docs/adr/0030-installing-applications.mdx).
oxyos-install = { path = "../../crates/oxyos-install" }
serde_json = "1"
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }
signal-hook = { version = "0.3", default-features = false }

[lints]
workspace = true
