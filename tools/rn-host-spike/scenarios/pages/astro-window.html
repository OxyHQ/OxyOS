<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OxyOS window</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: #1971c2; }
#mover { position: absolute; top: 0; width: 40px; height: 100%; background: #f08c00; }
</style>
</head>
<body>
<div id="mover"></div>
<script>
let until = 0;
let moving = false;
const move = (time) => {
  if (time > until) {
    moving = false;
    mover.style.left = "0px";
    return;
  }
  mover.style.left = `${Math.round((time / 4) % 200)}px`;
  requestAnimationFrame(move);
};
const animate = (ms) => {
  until = performance.now() + ms;
  if (!moving) {
    moving = true;
    requestAnimationFrame(move);
  }
};
const paint = () => {
  document.body.style.background = innerWidth > 1000 ? "#2f9e44" : "#1971c2";
  animate(1500);
};
addEventListener("resize", paint);
addEventListener("pointerdown", () => animate(2500));
document.body.style.background = "#1971c2";
</script>
</body>
</html>
