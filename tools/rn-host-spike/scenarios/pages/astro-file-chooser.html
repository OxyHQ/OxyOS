<!doctype html>
<meta charset="utf-8">
<title>File chooser</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; font: 16px sans-serif; }
  label { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
  input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
</style>
<!-- The whole page is a file input for PNG images: green with the chosen file's name once chosen,
     orange once the person cancels (ADR 0029, decision 8). -->
<label id="zone"><span id="said">choose</span><input id="input" type="file" accept=".png"></label>
<script>
  const input = document.getElementById('input');
  const said = document.getElementById('said');
  input.addEventListener('change', () => {
    document.body.style.background = '#2b8a3e';
    said.textContent = [...input.files].map((file) => `${file.name} ${file.size}`).join(', ');
  });
  input.addEventListener('cancel', () => {
    document.body.style.background = '#e8590c';
    said.textContent = 'cancelled';
  });
</script>
