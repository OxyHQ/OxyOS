[package]
name = "oxyos-login"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
oxyos-auth = { path = "../../crates/oxyos-auth" }
oxyos-account = { path = "../../crates/oxyos-account", default-features = false }
oxyos-seat = { path = "../../crates/oxyos-seat" }
oxyos-seqpacket = { path = "../../crates/oxyos-seqpacket" }
oxyos-vt = { path = "../../crates/oxyos-vt" }
rustix = { version = "1.1.6", default-features = false, features = ["std", "process", "net", "event", "time"] }
signal-hook = { version = "0.3", default-features = false }
zeroize = "1"

[dev-dependencies]
# The worker's tests start stand-in sessions with their heartbeat as descriptor 3.
libc = "0.2"
serde_json = "1"
# The tests wait for the login program's socket to appear (inotify).
rustix = { version = "1.1.6", default-features = false, features = ["fs"] }

[lints]
workspace = true
