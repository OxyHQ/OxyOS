[package]
name = "oxyos-accountd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
oxyos-account = { workspace = true, default-features = true }
# The administrator's password that authorizes erasing the machine, checked by PAM and throttled as
# the lock checks one (src/passwords.rs).
oxyos-auth.workspace = true
rustix = { workspace = true, features = ["std", "process"] }
# The PIN read from PAM, overwritten once handed on (oxyos-pin-check).
zeroize.workspace = true

[lints]
workspace = true
