[package]
name = "oxyos-accountd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Its unit's watchdog (sd_notify's WATCHDOG=1), without logind's bus.
oxyos-seat = { path = "../../crates/oxyos-seat", default-features = false }
oxyos-account = { path = "../../crates/oxyos-account" }
# The administrator's password that authorizes erasing the machine, checked by PAM and throttled as
# the lock checks one (src/passwords.rs).
oxyos-auth = { path = "../../crates/oxyos-auth" }
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }
# The PIN read from PAM, overwritten once handed on (oxyos-pin-check).
zeroize = "1"

[lints]
workspace = true
