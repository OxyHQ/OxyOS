[package]
name = "oxyos-backupd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "oxyos-backupd"
path = "src/main.rs"

[dependencies]
oxyos-backup = { path = "../../crates/oxyos-backup" }
oxyos-service-socket = { path = "../../crates/oxyos-service-socket" }
serde_json = "1"
rustix = { version = "1.1.6", default-features = false, features = ["std", "process", "event", "fs"] }

[lints]
workspace = true
