[package]
name = "oxyos-offscreen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
oxyos-protocol = { path = "../../crates/oxyos-protocol" }
oxyos-compositor-core = { path = "../../crates/oxyos-compositor-core" }
oxyos-apps = { path = "../../crates/oxyos-apps" }
oxyos-ipc = { path = "../../crates/oxyos-ipc" }
oxyos-client = { path = "../../crates/oxyos-client" }
oxyos-gpu = { path = "../../crates/oxyos-gpu" }
oxyos-kms = { path = "../../crates/oxyos-kms" }
oxyos-input = { path = "../../crates/oxyos-input" }
oxyos-vt = { path = "../../crates/oxyos-vt" }
oxyos-seat = { path = "../../crates/oxyos-seat" }
oxyos-compositor = { path = "../../crates/oxyos-compositor" }
# The system's sounds, recorded (docs/adr/0044-system-sounds.mdx).
oxyos-sound = { path = "../../crates/oxyos-sound" }
oxyos-input-methods = { path = "../../crates/oxyos-input-methods" }
oxyos-auth = { path = "../../crates/oxyos-auth" }
oxyos-controls = { path = "../../crates/oxyos-controls" }
# The sound played (docs/adr/0056-sound-devices.mdx).
oxyos-audio = { path = "../../crates/oxyos-audio" }
# The input methods the preferences know (`--input-sources-available`, ADR 0041) and the JSON
# the session tells of them.
oxyos-preferences = { path = "../../crates/oxyos-preferences" }
serde_json = "1"
# A played NetworkManager's control interface (`--network-bus`, docs/adr/0038-networks.mdx).
zbus = "5"
# zbus's reactor, started before the descriptors are counted.
async-io = "2"
# The run's home, which a file chooser's answer is checked against (ADR 0029, decision 8).
oxyos-files = { path = "../../crates/oxyos-files", default-features = false }
# Virtual devices for `--launch --uinput`: the director types and points through the kernel.
evdev = "0.13"
rustix = { version = "1.1.6", default-features = false, features = ["std", "event", "time", "pipe", "process"] }

[lints]
workspace = true
