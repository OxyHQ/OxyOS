name: Image configuration

on:
  push:
    branches: [main]
    paths: ['config/**', '.github/workflows/**', 'scripts/check-image-config.py']
  pull_request:
    paths: ['config/**', '.github/workflows/**', 'scripts/check-image-config.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-config-${{ github.ref }}
  cancel-in-progress: true

# Static checks only. No workflow builds or publishes an image until a native
# session and its boot acceptance tests exist (see docs/iso-build.mdx).
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check-image-config.py
