name: Website CI

# Builds exactly what deploy-demo.yml publishes to os.oxy.so — the website and
# the shell demo assembled under /demo — without deploying it, so a pull request
# learns that the combined artifact no longer builds before main does.
# deploy-demo.yml only runs on main; until this existed, its first signal was a
# failed production deploy.

on:
  pull_request:
    paths:
      - "website/**"
      - "shell/**"
      - ".github/workflows/deploy-demo.yml"
      - ".github/workflows/website-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Build the shell demo
        working-directory: shell
        run: |
          bun install --frozen-lockfile
          bun run build:web

      - name: Build the combined website artifact
        working-directory: website
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run assemble:demo -- ../shell/web-build
        env:
          NODE_ENV: production
