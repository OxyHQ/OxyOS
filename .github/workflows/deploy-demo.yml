name: Deploy Shell Demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [shell/**, website/**, .github/workflows/deploy-demo.yml]

permissions:
  contents: read

concurrency:
  group: oxyos-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The website (os.oxy.so, its apt repository under /packages, and the
      # /demo shell) lives in `website/` of this repository. It used to be
      # checked out from OxyHQ/OxyOS-website, which no longer exists: every run
      # from 2026-09-26 on failed at that checkout with "Repository not found",
      # so no shell change reached os.oxy.so/demo after 2026-09-10.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Verify and build the shell demo
        working-directory: shell
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run lint
          bun run build:web

      - name: Build the combined website artifact
        working-directory: website
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run assemble:demo -- ../shell/web-build
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        working-directory: website
        run: bunx wrangler pages deploy dist --project-name=oxyos-website --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
