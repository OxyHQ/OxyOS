name: Native foundation

on:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'tools/**', 'scripts/check-native-boundary.py', 'scripts/test_check_native_boundary.py', 'docs/native-foundation.mdx', '.github/workflows/native-ci.yml']
  # Every pull request and every merge queue entry: its jobs are required checks of main
  # (docs/developing.mdx), so they report whatever a change touches.
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

# Each job runs on x86-64 and on AArch64 (GitHub's Arm runners), natively: OxyOS is built and tested
# for both architectures (docs/adr/0032-arm.mdx). Nothing here builds or publishes an image.
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Twenty minutes for building and testing, and ten more at most for the system's packages (their
    # own step's limit below): a slow mirror fails that step, saying so, and never eats the build's.
    timeout-minutes: 30
    env:
      APT_PACKAGES: libinput-dev libudev-dev libxkbcommon-dev xkb-data libvulkan1 mesa-vulkan-drivers dbus-daemon libpipewire-0.3-dev libclang-dev pipewire-bin libspa-0.2-modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: toolchain
        run: |
          python3 -c 'import tomllib; print("version=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: rustfmt, clippy
      # oxyos-input links libinput, libudev and xkbcommon; its tests read the keymaps (xkb-data) and
      # the compose tables the image ships.
      # oxyos-networks' tests run a played NetworkManager on a bus of their own (dbus-daemon).
      # oxyos-sound plays the system's sounds through PipeWire's own Rust bindings, generated from its
      # headers with libclang (docs/adr/0044-system-sounds.mdx).
      # oxyos-audio's tests follow and change a PipeWire daemon of their own, with PipeWire's own
      # tools (pipewire-bin: pipewire, pw-cli, pw-metadata; docs/adr/0056-sound-devices.mdx).
      #
      # The packages are kept between runs (actions/cache), so a slow archive mirror cannot hold the
      # gate up: the key is the package list and the runner's image, whose apt sources and installed
      # packages decide what apt fetches. On a hit the indexes and .debs it saved install with no
      # network at all (--no-download). Otherwise the newest cache of an older image lends its .debs,
      # apt fetches only what they lack, and the result is saved for the next run, right away, so a
      # run cancelled later still leaves it.
      - id: apt-key
        run: |
          image="${ImageOS:-$(. /etc/os-release && echo "$ID$VERSION_ID")}"
          packages=$(printf '%s' "$APT_PACKAGES" | sha256sum | cut -c1-16)
          echo "prefix=apt-$image-$RUNNER_ARCH-$packages-" >> "$GITHUB_OUTPUT"
          echo "key=apt-$image-$RUNNER_ARCH-$packages-${ImageVersion:-unversioned}" >> "$GITHUB_OUTPUT"
      - id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-cache
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: ${{ steps.apt-key.outputs.prefix }}
      - name: The system's packages
        timeout-minutes: 10
        env:
          HIT: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          cache=~/apt-cache
          if compgen -G "$cache/archives/*.deb" > /dev/null; then
            sudo cp "$cache"/archives/*.deb /var/cache/apt/archives/
          fi
          if [ "$HIT" = true ] && [ -d "$cache/lists" ]; then
            sudo cp "$cache"/lists/* /var/lib/apt/lists/
            if sudo apt-get install -y -q --no-download $APT_PACKAGES; then
              exit 0
            fi
            echo "::warning::The cached packages did not install alone; fetching what they lack"
          fi
          sudo apt-get update -q -o Acquire::Retries=3
          sudo apt-get install -y -q -o Acquire::Retries=3 $APT_PACKAGES
          sudo apt-get autoclean -q
          rm -rf "$cache" && mkdir -p "$cache/archives" "$cache/lists"
          if ! compgen -G "/var/cache/apt/archives/*.deb" > /dev/null; then
            echo "::warning::apt kept no packages to cache"
          else
            cp /var/cache/apt/archives/*.deb "$cache/archives/"
          fi
          find /var/lib/apt/lists -maxdepth 1 -type f ! -name lock -exec cp -t "$cache/lists/" {} +
      - if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-cache
          key: ${{ steps.apt-key.outputs.key }}
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
        env:
          XLOCALEDIR: ${{ github.workspace }}/config/includes.chroot_after_packages/usr/share/X11/locale
      # The install service's compiler runs as root in a transient systemd unit (ADR 0030, step 2), and
      # systemd may refuse as a transient unit's property what a unit file takes: only starting the
      # unit, as root, proves its sandbox (crates/oxyos-install/src/tests/sandbox.rs).
      - name: The compiler's sandbox under systemd, as root
        run: |
          test=$(cargo test --locked -p oxyos-install --lib --no-run --message-format=json \
            | python3 -c 'import json, sys; print(*[m["executable"] for m in map(json.loads, sys.stdin) if m.get("reason") == "compiler-artifact" and m["profile"]["test"] and m.get("executable")])')
          sudo "$test" --ignored --exact tests::sandbox::the_compilers_sandbox_runs_under_systemd
      # The accounts service's unit, started as root with a probe in place of the service: a user set
      # up with its home and removed in its sandbox, which once left /home read-only
      # (tools/oxyos-accountd/src/unit_sandbox.rs).
      - name: The accounts service's sandbox under systemd, as root
        run: |
          test=$(cargo test --locked -p oxyos-accountd --bin oxyos-accountd --no-run --message-format=json \
            | python3 -c 'import json, sys; print(*[m["executable"] for m in map(json.loads, sys.stdin) if m.get("reason") == "compiler-artifact" and m["profile"]["test"] and m.get("executable")])')
          sudo "$test" --ignored --exact unit_sandbox::the_units_sandbox_sets_a_user_up
      # The development compositor's runs through virtual devices read their own and no other
      # run's, and the seat adds a mouse plugged in and removes it unplugged (docs/adr/0042-scrolling.mdx):
      # devices only root may make in the kernel (uinput), read through udev.
      - name: Input devices through uinput, as root
        run: |
          sudo modprobe uinput
          executable() {
            cargo test --locked -p "$1" "$2" --no-run --message-format=json \
              | python3 -c 'import json, sys; print(*[m["executable"] for m in map(json.loads, sys.stdin) if m.get("reason") == "compiler-artifact" and m["profile"]["test"] and m.get("executable")])'
          }
          sudo "$(executable oxyos-input --lib)" --ignored --exact tests::the_seat_adds_a_mouse_plugged_in_and_removes_it_unplugged
          offscreen="$(executable oxyos-offscreen --bin=oxyos-offscreen)"
          sudo "$offscreen" --ignored --exact uinput::tests::a_run_reads_its_own_devices_and_never_another_runs
          # The virtual touchpad's swipes and pinches of three and four fingers, as libinput
          # counts them (docs/adr/0046-interactive-gestures.mdx, More Gestures).
          sudo "$offscreen" --ignored --exact uinput::tests::libinput_counts_the_virtual_touchpads_swipes_and_pinches_of_three_and_four_fingers
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python3 scripts/check-native-boundary.py
      # The boundary script's crate layers on graphs written by hand (docs/native-architecture.mdx).
      - run: python3 scripts/test_check_native_boundary.py
      # regress.py's own checks (the input-delivery invariant) on records written by hand.
      - run: python3 tools/rn-host-spike/test_regress.py
      # The scenario gate's builds below every gate's scenarios (tools/gate/run-scenarios.sh).
      - run: python3 tools/gate/test_run_scenarios.py
      - run: cargo run --locked -p oxyos-platform-probe

  # The tests that run the system's useradd, chpasswd and userdel on a root of their own need
  # Debian trixie's (shadow 4.17), the tools OxyOS uses; ubuntu-latest's (shadow 4.13) cannot, and
  # the job above skips those tests, saying why (crates/oxyos-account/src/tests/mod.rs,
  # `passwd_tools`). Here they must run.
  passwd-tools:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    timeout-minutes: 15
    steps:
      - run: apt-get update -q && apt-get install -y -q --no-install-recommends ca-certificates curl gcc libc6-dev python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: toolchain
        run: |
          python3 -c 'import tomllib; print("version=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - run: cargo test --locked -p oxyos-account
        env:
          OXYOS_ACCOUNT_PASSWD_TOOLS: required

  # Backups go through Debian's restic and, for a share, rclone's SMB client (docs/adr/0059-backups.mdx):
  # the engine's and the service's tests need both, and the share's a samba of their own, which smbd
  # runs as root (it changes to the share's user). Debian trixie's are the image's versions; without
  # them the job above skips those tests, saying why, and here they must run. So must a whole
  # computer's restore (tests/restore.rs): its users made again on another root by Debian's
  # groupadd and useradd (`--prefix`), and, as root here, its files' owners checked.
  backup-engine:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    timeout-minutes: 20
    steps:
      - run: apt-get update -q && apt-get install -y -q --no-install-recommends ca-certificates curl gcc libc6-dev pkg-config libudev-dev python3 restic rclone samba
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: toolchain
        run: |
          python3 -c 'import tomllib; print("version=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - run: cargo test --locked -p oxyos-backup
        env:
          OXYOS_BACKUP_ENGINE: required
          OXYOS_ACCOUNT_PASSWD_TOOLS: required
