name: Native foundation

on:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'tools/**', 'scripts/check-native-boundary.py', 'docs/native-foundation.mdx', '.github/workflows/native-ci.yml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'tools/**', 'scripts/check-native-boundary.py', 'docs/native-foundation.mdx', '.github/workflows/native-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: toolchain
        run: |
          python3 -c 'import tomllib; print("version=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: rustfmt, clippy
      # oxyos-input links libinput, libudev and xkbcommon; its tests read the keymaps (xkb-data) and
      # the compose tables the image ships.
      - run: sudo apt-get update -q && sudo apt-get install -y -q libinput-dev libudev-dev libxkbcommon-dev xkb-data
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
        env:
          XLOCALEDIR: ${{ github.workspace }}/config/includes.chroot_after_packages/usr/share/X11/locale
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python3 scripts/check-native-boundary.py
      - run: cargo run --locked -p oxyos-platform-probe
