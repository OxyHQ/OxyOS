name: Native foundation

on:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'tools/**', 'scripts/check-native-boundary.py', 'docs/native-foundation.mdx', '.github/workflows/native-ci.yml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'tools/**', 'scripts/check-native-boundary.py', 'docs/native-foundation.mdx', '.github/workflows/native-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: toolchain
        run: |
          python3 -c 'import tomllib; print("version=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: rustfmt, clippy
      # oxyos-input links libinput, libudev and xkbcommon; its tests read the keymaps (xkb-data) and
      # the compose tables the image ships.
      - run: sudo apt-get update -q && sudo apt-get install -y -q libinput-dev libudev-dev libxkbcommon-dev xkb-data libvulkan1 mesa-vulkan-drivers
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
        env:
          XLOCALEDIR: ${{ github.workspace }}/config/includes.chroot_after_packages/usr/share/X11/locale
      # The install service's compiler runs as root in a transient systemd unit (ADR 0030, step 2), and
      # systemd may refuse as a transient unit's property what a unit file takes: only starting the
      # unit, as root, proves its sandbox (crates/oxyos-install/src/tests/sandbox.rs).
      - name: The compiler's sandbox under systemd, as root
        run: |
          test=$(cargo test --locked -p oxyos-install --lib --no-run --message-format=json \
            | python3 -c 'import json, sys; print(*[m["executable"] for m in map(json.loads, sys.stdin) if m.get("reason") == "compiler-artifact" and m["profile"]["test"] and m.get("executable")])')
          sudo "$test" --ignored --exact tests::sandbox::the_compilers_sandbox_runs_under_systemd
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python3 scripts/check-native-boundary.py
      - run: cargo run --locked -p oxyos-platform-probe

  # The tests that run the system's useradd, chpasswd and userdel on a root of their own need
  # Debian trixie's (shadow 4.17), the tools OxyOS uses; ubuntu-latest's (shadow 4.13) cannot, and
  # the job above skips those tests, saying why (crates/oxyos-account/src/tests/mod.rs,
  # `passwd_tools`). Here they must run.
  passwd-tools:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 15
    steps:
      - run: apt-get update -q && apt-get install -y -q --no-install-recommends ca-certificates curl gcc libc6-dev python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: toolchain
        run: |
          python3 -c 'import tomllib; print("version=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - run: cargo test --locked -p oxyos-account
        env:
          OXYOS_ACCOUNT_PASSWD_TOOLS: required
